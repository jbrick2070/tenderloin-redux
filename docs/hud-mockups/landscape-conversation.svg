<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="920" height="440" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Landscape phone 900x380, Block Actions open from a conversation: the sheet docked right, the scene whole on the left</title>
  <rect width="920" height="440" fill="#1a1a1a"/>
  <g transform="translate(10,10)">
    <rect width="900" height="380" fill="#3b4a55"/>
    <polygon points="0,260 900,80 900,150 0,330" fill="#8a8f86"/>
    <rect x="0" y="60" width="160" height="150" fill="#b9975b"/>
    <rect x="200" y="40" width="120" height="110" fill="#c9a86a"/>
    <rect x="0" y="330" width="220" height="50" fill="#9c8a7a"/>
    <!-- Thanh and player in the left scene -->
    <ellipse cx="230" cy="250" rx="16" ry="6" fill="#f8cc58" opacity="0.6"/>
    <circle cx="230" cy="228" r="9" fill="#f2e2c4"/>
    <rect x="222" y="237" width="16" height="22" rx="4" fill="#4b7f9a"/>
    <text x="230" y="284" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffd25a" stroke="#0e171d" stroke-width="3" paint-order="stroke">YOU</text>
    <circle cx="300" cy="210" r="10" fill="#f2e2c4"/>
    <rect x="291" y="220" width="18" height="26" rx="4" fill="#3f7a5a"/>
    <text x="300" y="266" text-anchor="middle" font-size="14" fill="#fff3d6" stroke="#0e171d" stroke-width="3" paint-order="stroke">Thanh</text>
    <polygon points="60,160 80,150 76,160 80,170" fill="#ffd25a" transform="rotate(200 70 160)"/>
    <text x="88" y="165" font-size="14" fill="#ffe48f" stroke="#0e171d" stroke-width="3" paint-order="stroke">Bea · 36 m</text>

    <!-- header row -->
    <rect x="12" y="12" width="876" height="44" rx="8" fill="#0f1a22" stroke="#e0b24c" stroke-width="2"/>
    <rect x="14" y="12" width="56" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="42" y="39" text-anchor="middle" font-size="14" fill="#fff3d6">Menu</text>
    <text x="80" y="39" font-size="14" fill="#9ef5e5">Chapter 1: Get the Block Ready · Next: Choose the gathering: Bea's Long Table or Dez &amp; Celeste's Open …</text>
    <rect x="740" y="16" width="144" height="36" rx="18" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="812" y="39" text-anchor="middle" font-size="13" fill="#ffe48f">Sparks 9 · Keepsakes 0/10</text>

    <!-- street view button sits at the top-right of the remaining scene -->
    <rect x="312" y="64" width="132" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="378" y="91" text-anchor="middle" font-size="16" fill="#fff3d6">Street view</text>

    <!-- the sheet, docked right: x 456..888, y 64..368 -->
    <rect x="456" y="64" width="432" height="304" rx="10" fill="#0f1a22" stroke="#e0b24c" stroke-width="2"/>
    <rect x="458" y="66" width="428" height="44" rx="8" fill="#15222c"/>
    <text x="470" y="94" font-size="15" fill="#ffe082">Block Actions · 1/2</text>
    <rect x="786" y="68" width="96" height="40" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="834" y="94" text-anchor="middle" font-size="13" fill="#fff3d6">Hide ›</text>
    <text x="470" y="130" font-size="12" fill="#f2ead8">Thanh: "Hot tea and folding stools are stacked on Taylor. Open the block when you're ready."</text>
    <!-- 2 x 3 action grid, 44 px -->
    <rect x="466" y="140" width="204" height="44" rx="6" fill="#4a3b14" stroke="#ffd25a" stroke-width="2"/>
    <text x="568" y="167" text-anchor="middle" font-size="13" fill="#fff3d6">Open Block Party!</text>
    <rect x="676" y="140" width="204" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="778" y="167" text-anchor="middle" font-size="13" fill="#fff3d6">Visit Next Neighbor</text>
    <rect x="466" y="190" width="204" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5" opacity="0.55"/>
    <text x="568" y="217" text-anchor="middle" font-size="13" fill="#fff3d6" opacity="0.7">Take Group Photo</text>
    <rect x="676" y="190" width="204" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5" opacity="0.55"/>
    <text x="778" y="217" text-anchor="middle" font-size="13" fill="#fff3d6" opacity="0.7">Plan Party Schedule</text>
    <rect x="466" y="240" width="204" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="568" y="267" text-anchor="middle" font-size="13" fill="#fff3d6">Paint w/ Celeste (3/3)</text>
    <rect x="676" y="240" width="204" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="778" y="267" text-anchor="middle" font-size="13" fill="#fff3d6">Soundcheck w/ Rook</text>
    <!-- nav row, all on screen -->
    <rect x="466" y="304" width="96" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5" opacity="0.55"/>
    <text x="514" y="331" text-anchor="middle" font-size="13" fill="#fff3d6" opacity="0.7">Previous</text>
    <rect x="568" y="304" width="96" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="616" y="331" text-anchor="middle" font-size="13" fill="#fff3d6">Next 2/2</text>
    <rect x="670" y="304" width="102" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="721" y="331" text-anchor="middle" font-size="13" fill="#fff3d6">Back to Thanh</text>
    <rect x="778" y="304" width="102" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="829" y="331" text-anchor="middle" font-size="13" fill="#fff3d6">Close</text>

    <!-- dimension notes -->
    <text x="16" y="362" font-size="11" fill="#ff9fb5">scene 436 x 304 px, one piece (today a 75 px strip; Previous / Next / Close were off screen)</text>
    <text x="466" y="362" font-size="11" fill="#ff9fb5">dock 432 px = clamp(0.48 w, 280, 440) · 10 actions, 6 per page · nav ends 12 px above the edge</text>
  </g>
  <text x="10" y="412" font-size="12" fill="#d8d8d8">Landscape 900x380 · All Actions opened from a conversation · the bottom bar is hidden because the dock holds Back and Close</text>
  <text x="10" y="428" font-size="12" fill="#d8d8d8">Talking uses the same dock: handle, the line at 16 px, row 1 (Chat More · Next Step · Goodbye), row 2 after Next Step · Hide › leaves a one-line bar</text>
</svg>
