<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410 730" width="410" height="730" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Portrait phone 390x667, Menu open: settings and sources in one list under the header</title>
  <rect width="410" height="730" fill="#1a1a1a"/>
  <g transform="translate(10,10)">
    <rect width="390" height="667" fill="#3b4a55"/>
    <polygon points="0,420 390,250 390,330 0,500" fill="#8a8f86"/>
    <rect x="0" y="130" width="130" height="200" fill="#b9975b"/>
    <rect x="300" y="110" width="90" height="120" fill="#6f8a7a"/>
    <rect x="200" y="470" width="190" height="130" fill="#8c6f5a"/>
    <!-- bottom bar behind the dim -->
    <rect x="8" y="605" width="119" height="50" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="67" y="635" text-anchor="middle" font-size="14" fill="#fff3d6">Next Step</text>
    <rect x="135" y="605" width="120" height="50" rx="6" fill="#4a3b14" stroke="#ffd25a" stroke-width="2"/>
    <text x="195" y="635" text-anchor="middle" font-size="14" fill="#fff3d6">Meet Thanh</text>
    <rect x="263" y="605" width="119" height="50" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="322" y="635" text-anchor="middle" font-size="14" fill="#fff3d6">Explore</text>
    <!-- dim: tapping it closes the menu -->
    <rect width="390" height="667" fill="#05090c" opacity="0.55"/>

    <!-- header row, Menu pressed -->
    <rect x="8" y="8" width="374" height="48" rx="8" fill="#0f1a22" stroke="#e0b24c" stroke-width="2"/>
    <rect x="12" y="10" width="56" height="44" rx="6" fill="#4a3b14" stroke="#ffd25a" stroke-width="2"/>
    <text x="40" y="37" text-anchor="middle" font-size="14" fill="#fff3d6">Menu</text>
    <text x="76" y="37" font-size="14" fill="#9ef5e5">Ch. 1 · Next: Meet Thanh (4/5)</text>
    <rect x="310" y="14" width="68" height="36" rx="18" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="344" y="37" text-anchor="middle" font-size="13" fill="#ffe48f">✦ 8 · 0/10</text>

    <!-- the menu list, 48 px rows -->
    <rect x="8" y="64" width="374" height="528" rx="10" fill="#0f1a22" stroke="#e0b24c" stroke-width="2"/>
    <g font-size="15" fill="#fff3d6">
      <rect x="16" y="72" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="100">Music: On</text>
      <rect x="16" y="120" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="148">Sounds: On</text>
      <rect x="16" y="168" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="196">Reduced motion: System (off)</text>
      <rect x="16" y="216" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="244">Street view</text>
      <rect x="16" y="264" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="292">About this place ›</text>
      <rect x="16" y="312" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="340">Before These Streets ›</text>
      <rect x="16" y="360" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="388">Local Stories: Off</text>
      <rect x="16" y="408" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="436">District Border: On</text>
      <rect x="16" y="456" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
      <text x="28" y="484">Import Web Save</text>
    </g>
    <text x="28" y="520" font-size="10" fill="#b8c7c8">City: DataSF / PDDL · Streets: OSM / ODbL · Scenery and the afternoon are fictional</text>
    <rect x="16" y="536" width="358" height="44" rx="6" fill="#16232e" stroke="#d9b35a" stroke-width="1.5"/>
    <text x="195" y="564" text-anchor="middle" font-size="15" fill="#fff3d6">Close</text>

    <text x="14" y="664" font-size="11" fill="#ff9fb5">Esc or a tap on the dimmed scene closes it · focus returns to Menu · fits 320x667 unchanged</text>
  </g>
  <text x="10" y="700" font-size="12" fill="#d8d8d8">Portrait 390x667 · Menu open · the sheet collapses to its bar (or hides) while the menu is open; opening a sheet closes the menu</text>
  <text x="10" y="716" font-size="12" fill="#d8d8d8">About this place holds what Info holds today: where you are, how to walk, the sources, the full credit line</text>
</svg>
