name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache Godot 4.7.2 Linux & Web export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot-4.7.2
            ~/.local/share/godot/export_templates/4.7.2.stable
          key: godot-4.7.2-linux-web-v1

      - name: Install Godot 4.7.2 & Web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot-4.7.2 ~/.local/share/godot/export_templates/4.7.2.stable
          curl -fL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d ~/.cache/godot-4.7.2
          chmod +x ~/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64
          curl -fL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q -j /tmp/templates.tpz templates/version.txt templates/web_nothreads_debug.zip templates/web_nothreads_release.zip -d ~/.local/share/godot/export_templates/4.7.2.stable
          rm -f /tmp/godot.zip /tmp/templates.tpz

      - name: Verify syntax and run unit/data tests
        run: |
          npm run check
          npm test

      - name: Export Godot 4.7.2 3D WebAssembly build
        run: |
          export GODOT_BIN="$HOME/.cache/godot-4.7.2/Godot_v4.7.2-stable_linux.x86_64"
          npm run godot:import
          npm run godot:test
          npm run godot:export

      - name: Assemble GitHub Pages site (_site)
        run: |
          mkdir -p _site _site/godot _site/browser _site/field-guide
          cp -r artifacts/godot-web/* _site/
          cp -r artifacts/godot-web/* _site/godot/
          cp -r public/* _site/browser/
          cp -r tools/field-guide/* _site/field-guide/
          cp godot/data/buildings.json _site/field-guide/buildings.json
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
