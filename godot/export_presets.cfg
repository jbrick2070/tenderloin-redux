[preset.0]
name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="data/buildings.json,data/neighborhood_voices.json,data/street_trees.json,data/lidar_2023.json,data/power_place.json,data/voting_places.json,ENGINE_LICENSE.txt"
exclude_filter="data/source/*,tests/*"
export_path="../artifacts/godot-web/index.html"

[preset.0.options]
variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false
